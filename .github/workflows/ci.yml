name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck server
        run: npm run typecheck -w apps/server

      - name: Lint client
        run: npm run lint -w apps/client

      - name: Test
        run: npm test

      - name: Build client
        run: npm run build -w apps/client
